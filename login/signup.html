<!DOCTYPE html>
<html>

<head>

<title>Create Account | Stock Mind</title>

<link rel="stylesheet" href="signup.css">

</head>


<body>


<header class="signup-header">


<a href="../home/index.html">

<img src="../components/logo.png">

<span>
Stock <strong>Mind</strong>
</span>

</a>


</header>



<main class="signup-page">



<div class="signup-card">


<h1>
Create Account 🚀
</h1>


<p>
Join Stock Mind Marketplace
</p>



<form id="signupForm">



<div class="profile-upload">


<img 
id="preview"
src="https://i.pravatar.cc/150"
>


<label for="image">

Upload Photo

</label>


<input 
type="file"
id="image"
accept="image/*"
>


</div>





<label>
Full Name
</label>


<input 
id="name"
type="text"
placeholder="Your full name"
required>





<label>
Username
</label>


<input 
id="username"
type="text"
placeholder="Username"
required>





<label>
Email
</label>


<input 
id="email"
type="email"
placeholder="Email address"
required>





<label>
Phone Number
</label>


<input 
id="phone"
type="text"
placeholder="+962 7X XXX XXXX"
required>





<div class="row">


<div>

<label>
Country
</label>


<input 
id="country"
value="Jordan">

</div>



<div>

<label>
City
</label>


<input 
id="city"
placeholder="Amman">

</div>


</div>






<label>
Address
</label>


<textarea 
id="address"
placeholder="Street, Building, Area">

</textarea>






<label>
Password
</label>


<input 
id="password"
type="password"
placeholder="Password"
required>





<label>
Confirm Password
</label>


<input 
id="confirmPassword"
type="password"
placeholder="Confirm Password"
required>







<label>
Account Type
</label>


<div class="roles">


<button 
type="button"
id="buyer"
class="role active">

🛒 Buyer

</button>


<button 
type="button"
id="seller"
class="role">

🏪 Seller

</button>


</div>






<button class="signup-btn">

Create Account

</button>



</form>



<p class="login-link">

Already have account?

<a href="login.html">
Login
</a>

</p>



</div>


</main>



<script src="signup.js"></script>


</body>

</html>
