<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Stock Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signup.css">
</head>

<body>

<!-- soft background (no warehouse scene) -->
<div class="bg" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <canvas id="bgCanvas"></canvas>
    <div class="vignette"></div>
</div>


<!-- TOP BAR -->
<header class="topbar">
    <a href="../home/index.html" class="brand">
        <span class="brand-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        </span>
        <span>Stock <b>Mind</b></span>
    </a>

    <a href="../home/index.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Back to home
    </a>
</header>


<main class="signup-page">

    <div class="card-wrap" id="cardWrap">
        <div class="signup-card" id="signupCard">

            <div class="shine"></div>

            <h1>Create Account <span class="wave">🚀</span></h1>
            <p class="sub">Join Stock Mind Marketplace</p>

            <form id="signupForm" novalidate>

                <!-- photo -->
                <div class="profile-upload">
                    <div class="avatar">
                        <img id="preview" src="https://i.pravatar.cc/150" alt="Profile photo">
                        <label for="image" class="cam" title="Upload photo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
                        </label>
                    </div>
                    <label for="image" class="upload-txt">Upload Photo</label>
                    <input type="file" id="image" accept="image/*">
                </div>

                <div class="field">
                    <input id="name" type="text" placeholder=" " autocomplete="name">
                    <label for="name">Full Name</label>
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                </div>

                <div class="field">
                    <input id="username" type="text" placeholder=" " autocomplete="username">
                    <label for="username">Username</label>
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.5 7.1"/></svg>
                </div>

                <div class="field">
                    <input id="email" type="email" placeholder=" " autocomplete="email">
                    <label for="email">Email</label>
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
                </div>

                <div class="field">
                    <input id="phone" type="tel" placeholder=" " autocomplete="tel">
                    <label for="phone">Phone Number  (+962 7X XXX XXXX)</label>
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
                </div>

                <div class="row">
                    <div class="field">
                        <input id="country" type="text" placeholder=" " value="Jordan" autocomplete="country-name">
                        <label for="country">Country</label>
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
                    </div>

                    <div class="field">
                        <input id="city" type="text" placeholder=" " autocomplete="address-level2">
                        <label for="city">City</label>
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    </div>
                </div>

                <div class="field">
                    <textarea id="address" placeholder=" " autocomplete="street-address"></textarea>
                    <label for="address">Address  (Street, Building, Area)</label>
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
                </div>

                <div class="field">
                    <input id="password" type="password" placeholder=" " autocomplete="new-password">
                    <label for="password">Password</label>
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    <button type="button" class="eye" data-target="password" aria-label="Show password">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 7.6A17 17 0 0 0 2 12s3.5 6 10 6a9.7 9.7 0 0 0 3.4-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                </div>

                <div class="strength" id="strength">
                    <div class="bars"><i></i><i></i><i></i><i></i></div>
                    <span id="strengthText">Use 6+ characters</span>
                </div>

                <div class="field">
                    <input id="confirmPassword" type="password" placeholder=" " autocomplete="new-password">
                    <label for="confirmPassword">Confirm Password</label>
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
                    <button type="button" class="eye" data-target="confirmPassword" aria-label="Show password">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 7.6A17 17 0 0 0 2 12s3.5 6 10 6a9.7 9.7 0 0 0 3.4-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                </div>

                <!-- account type -->
                <p class="group-label">Account Type</p>
                <div class="roles" id="roles">
                    <div class="role-slider"></div>

                    <button type="button" class="role active" id="buyer">
                    <em class="role-icon">
                        <i data-lucide="users"></i>
                    </em>
                    <strong>Buyer</strong>
                    <span>Buy products</span>
                </button>


                <button type="button" class="role" id="seller">
                    <em class="role-icon">
                        <i data-lucide="store"></i>
                    </em>
                    <strong>Seller</strong>
                    <span>Sell products</span>
                </button>
                </div>

                <div class="form-error" id="formError" role="alert"></div>

                <button type="submit" class="signup-btn" id="signupBtn">
                    <a href="../login/signup.html" class="your-button">
    Create Account
</a>
                    <span class="btn-arrow">→</span>
                    <span class="spinner"></span>
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="../login/login.html">Login</a>
            </p>

        </div>
    </div>

</main>


<!-- success overlay -->
<div class="success" id="success">
    <div class="success-box">
        <svg viewBox="0 0 52 52" class="check">
            <circle cx="26" cy="26" r="23" class="check-c"/>
            <path d="M15 27l8 8 14-16" class="check-p"/>
        </svg>
        <h4>Account created!</h4>
        <p>Taking you to login...</p>
    </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>
<script src="signup.js"></script>
</body>
</html>
