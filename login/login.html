<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Mind | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>

<body>

<!-- =====================================================
     BACKGROUND SCENE  (warehouse + conveyor belts)
===================================================== -->
<div class="scene" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>

    <canvas id="bgCanvas"></canvas>

    <div class="floor-wrap"><div class="floor"></div></div>

    <!-- far belt: small boxes moving the other way -->
    <div class="far-zone"><div class="far-belt"></div><div class="far-lane" id="farLane"></div></div>

    <!-- near belt: the main belt the big box arrives on -->
    <div class="belt-zone">
        <div class="belt"></div>
        <div class="belt-glow"></div>
        <div class="near-lane" id="nearLane"></div>
    </div>

    <div class="vignette"></div>
</div>

<canvas id="fxCanvas" aria-hidden="true"></canvas>


<!-- =====================================================
     TOP BAR
===================================================== -->
<header class="topbar">
    <a href="../home/index.html" class="brand">
        <span class="brand-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        </span>
        <span>Stock <b>Mind</b></span>
    </a>

    <a href="../home/index.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Back to home
    </a>
</header>


<!-- =====================================================
     STAGE
===================================================== -->
<main class="stage" id="stage">

    <!-- floating info chips (appear after the form pops out) -->
    


    <!-- ========== THE BOX ========== -->
    <div class="hero-box" id="heroBox" aria-hidden="true">

        <div class="beam"></div>
        <div class="shock"></div>
        <div class="hero-shadow"></div>

        <div class="hero-shake">
            <div class="persp">
                <div class="cube" id="cube">

                    <div class="face f-bottom"></div>
                    <div class="face f-back"></div>
                    <div class="face f-left"></div>

                    <div class="face f-right">
                        <span class="frag">FRAGILE</span>
                        <span class="bar"></span>
                    </div>

                    <div class="face f-front">
                        <div class="f-label">
                            <span class="lg">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
                            </span>
                            <b>STOCK<em>MIND</em></b>
                            <small>AI INVENTORY</small>
                        </div>
                        <span class="up">↑ ↑</span>
                    </div>

                    <div class="inner-glow"></div>

                    <div class="flap fl-left"></div>
                    <div class="flap fl-right"></div>
                    <div class="flap fl-back"><i class="tape"></i></div>
                    <div class="flap fl-front"><i class="tape"></i></div>

                </div>
            </div>
        </div>
    </div>


    <!-- ========== LOGIN CARD ========== -->
    <div class="card-clip" id="cardClip">
        <div class="card-wrap" id="cardWrap">
            <div class="login-card" id="loginCard">

                <div class="shine"></div>

                <h2>Welcome Back <span class="wave">👋</span></h2>
                <p class="sub">Login to your Stock Mind account</p>

                <div class="roles" id="roles">
                    <div class="role-slider"></div>

                    <button type="button" class="role active" id="buyerRole">
                    <em class="role-icon">
                        <i data-lucide="users"></i>
                    </em>
                    <strong>Buyer</strong>
                    <span>Buy products</span>
                </button>


                <button type="button" class="role" id="sellerRole">
                    <em class="role-icon">
                        <i data-lucide="store"></i>
                    </em>
                    <strong>Seller</strong>
                    <span>Sell products</span>
                </button>


                <button type="button" class="role" id="adminRole">
                    <em class="role-icon">
                        <i data-lucide="shield"></i>
                    </em>
                    <strong>Admin</strong>
                    <span>Manage site</span>
                </button>
                </div>

                <h3 id="loginType">Login as Buyer</h3>

                <form id="loginForm" novalidate>

                    <div class="field">
                        <input type="email" id="email" placeholder=" " autocomplete="email">
                        <label for="email">Email</label>
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
                    </div>

                    <div class="field">
                        <input type="password" id="password" placeholder=" " autocomplete="current-password">
                        <label for="password">Password</label>
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>

                        <button type="button" id="showPassword" aria-label="Show password">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 7.6A17 17 0 0 0 2 12s3.5 6 10 6a9.7 9.7 0 0 0 3.4-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        </button>
                    </div>

                    <div class="form-error" id="formError" role="alert"></div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="btn-text">Login</span>
                        <span class="btn-arrow">→</span>
                        <span class="spinner"></span>
                    </button>

                </form>

                

<p class="signup-line">
    New here? <a href="signup.html">Create an account</a>
</p>            </div>
        </div>
    </div>

</main>


<!-- skip / replay -->
<button type="button" class="skip" id="skipBtn">Skip intro <span>⏭</span></button>
<button type="button" class="replay" id="replayBtn" title="Replay intro" aria-label="Replay intro">↻</button>


<!-- success overlay -->
<div class="success" id="success">
    <div class="success-box">
        <svg viewBox="0 0 52 52" class="check">
            <circle cx="26" cy="26" r="23" class="check-c"/>
            <path d="M15 27l8 8 14-16" class="check-p"/>
        </svg>
        <h4>Welcome back!</h4>
        <p id="successText">Taking you to your dashboard...</p>
    </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>
<script src="login.js"></script>
</body>
</html>
