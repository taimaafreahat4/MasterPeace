<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rate Your Order - Stock Mind</title>

    <link rel="stylesheet" href="feedback.css">
    <link rel="stylesheet" href="../../components/navbar.css">
    <link rel="stylesheet" href="../../components/footer.css">

</head>

<body>

<div id="navbar-container"></div>


<main class="feedback-page">


    <h1>Rate your order</h1>

    <p class="subtitle">
        Tell us what you think about your order
        <span id="orderNumber">#SM123456</span>
    </p>


    <section class="feedback-card">


        <div class="product-box">

            <img id="productImage"
            src="../Images/clothes/product.jpg">

            <div>
                <h3 id="productName">
                    Product Name
                </h3>

                <p>
                    Delivered successfully
                </p>
            </div>

        </div>



        <hr>


        <h4>
            How was the product?
        </h4>


        <div class="stars">

            <span data-star="1">★</span>
            <span data-star="2">★</span>
            <span data-star="3">★</span>
            <span data-star="4">★</span>
            <span data-star="5">★</span>

        </div>


        <p class="hint">
            Tap a star to rate
        </p>


        <hr>



        <h4>
            What did you like?
        </h4>


        <div class="tags">

            <button>
                Fast delivery
            </button>

            <button>
                Good packaging
            </button>

            <button>
                Product quality
            </button>

            <button>
                As described
            </button>

        </div>



        <hr>



        <h4>
            Write a review
        </h4>


        <textarea
        id="review"
        placeholder="Share details of your experience with this product..."
        ></textarea>



    </section>



    <button id="submitReview">
        Submit review
    </button>



    <p class="skip">
        You can skip this and rate later from your order history
    </p>


</main>


<div id="footer-container"></div>



<script>

fetch("../../components/navbar.html")
.then(res => res.text())
.then(data=>{
    document.getElementById("navbar-container").innerHTML=data;
});


fetch("../../components/footer.html")
.then(res=>res.text())
.then(data=>{
    document.getElementById("footer-container").innerHTML=data;
});


</script>


<script src="feedback.js"></script>


</body>
</html>
