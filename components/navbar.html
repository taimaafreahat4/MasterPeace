/* =====================================================
   STOCK MIND NAVBAR
===================================================== */

.navbar,
.navbar * {
    box-sizing: border-box;
}

.navbar {
    width: 100%;
    min-height: 64px;
    background: #061735;
    display: flex;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    position: relative;
    z-index: 1000;
}

.nav-inner {
    width: 1180px;
    max-width: 92%;
    min-height: 64px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 38px;
}

/* LOGO */

.navbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
}

.navbar-logo-image {
    width: 38px;
    height: 38px;
    object-fit: contain;
    display: block;
}

.navbar-logo-text {
    color: #ffffff;
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.5px;
}

.navbar-logo-text strong {
    color: #a45cff;
}

/* NAV LINKS */

.nav-links {
    display: flex;
    align-items: center;
    gap: 34px;
    margin-left: 10px;
}

.nav-links a {
    color: #d8deeb;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    transition: color 0.2s ease;
}

.nav-links a:hover {
    color: #a45cff;
}

/* RIGHT ACTIONS */

.nav-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

/* CART */

.navbar-cart-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-decoration: none;
    font-size: 23px;
    width: 30px;
    height: 38px;
}

.cart-count {
    position: absolute;
    top: -2px;
    right: -8px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 20px;
    background: #7c3aed;
    color: white;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* FAVORITES */

.favorite-icon a {
    color: white;
    text-decoration: none;
    font-size: 23px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* GUEST BUTTONS */

#guestButtons {
    display: flex;
    align-items: center;
    gap: 9px;
}

#guestButtons[hidden] {
    display: none !important;
}

.navbar-login,
.navbar-signup {
    height: 34px;
    padding: 0 16px;
    border-radius: 20px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
}

.navbar-login {
    border: 1px solid #71809c;
    background: transparent;
    color: #ffffff;
}

.navbar-login:hover {
    border-color: #a45cff;
}

.navbar-signup {
    padding: 0 17px;
    border: none;
    background: #7135e8;
    color: #ffffff;
    font-weight: 600;
}

.navbar-signup:hover {
    background: #8042f5;
}

/* PROFILE */

.user-profile {
    position: relative;
    display: flex;
    align-items: center;
}

.user-profile[hidden] {
    display: none !important;
}

.profile-trigger {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 66px;
    padding: 2px 10px;
    border: none;
    background: transparent;
    color: white;
    font-family: inherit;
    cursor: pointer;
}

.profile-image {
    width: 48px;
    height: 48px;
    display: block;
    border: 2px solid #8b5cf6;
    border-radius: 50%;
    object-fit: cover;
    background: #ffffff;
}

#username {
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
}

.profile-arrow {
    position: absolute;
    top: 13px;
    right: -1px;
    color: #c4b5fd;
    font-size: 13px;
    transition: transform 0.2s ease;
}

.profile-trigger[aria-expanded="true"] .profile-arrow {
    transform: rotate(180deg);
}

/* DROPDOWN MENU */

.profile-menu {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    width: 245px;
    padding: 8px;
    background: #ffffff;
    color: #17233e;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 14px 35px rgba(0, 0, 0, 0.22);
    z-index: 10000;
}

.profile-menu[hidden] {
    display: none !important;
}

.dropdown-user {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 12px;
    margin-bottom: 6px;
    border-bottom: 1px solid #e5e7eb;
    overflow-wrap: anywhere;
}

.dropdown-user strong {
    color: #061735;
    font-size: 14px;
}

.dropdown-user small {
    color: #718096;
    font-size: 12px;
}

.profile-menu a,
.profile-menu button {
    width: 100%;
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 12px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: #1e293b;
    font-family: inherit;
    font-size: 13px;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
}

.profile-menu a:hover,
.profile-menu button:hover {
    background: #f3e8ff;
    color: #6d28d9;
}

.profile-menu .menu-icon {
    width: 20px;
    text-align: center;
    font-size: 16px;
}

.profile-menu #logoutBtn {
    margin-top: 5px;
    border-top: 1px solid #e5e7eb;
    border-radius: 0 0 9px 9px;
    color: #dc2626;
}

/* MOBILE BUTTON */

.mobile-menu {
    display: none;
    width: 38px;
    height: 38px;
    margin-left: auto;
    border: none;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

/* MOBILE LAYOUT */

@media (max-width: 900px) {
    .nav-inner {
        gap: 20px;
    }

    .nav-links {
        gap: 18px;
        margin-left: 0;
    }

    .nav-actions {
        gap: 10px;
    }
}

@media (max-width: 700px) {
    .navbar,
    .nav-inner {
        min-height: 60px;
    }

    .nav-inner {
        width: calc(100% - 30px);
        gap: 10px;
        flex-wrap: wrap;
    }

    .navbar-logo-text {
        font-size: 18px;
    }

    .navbar-logo-image {
        width: 34px;
        height: 34px;
    }

    .mobile-menu {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .nav-links {
        display: none;
    }

    .nav-inner.mobile-open .nav-links {
        display: flex;
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        padding: 20px;
        margin: 0;
        background: #061735;
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
        z-index: 9999;
    }

    .nav-inner.mobile-open .nav-actions {
        display: flex;
        position: absolute;
        top: 250px;
        left: 0;
        right: 0;
        margin: 0;
        padding: 15px 20px;
        background: #061735;
        justify-content: flex-start;
        flex-wrap: wrap;
        z-index: 9999;
    }

    .profile-menu {
        right: 0;
        width: 230px;
    }

}

/* Profile image and name side by side */
.profile-trigger {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: auto;
    padding: 5px 10px;
    border-radius: 10px;
}

.profile-image {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
}

#username {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    margin: 0;
}

/* Remove any remaining dropdown arrow */
.profile-arrow {
    display: none !important;
}

/* Shared navigation layout and controls. */
.stockmind-nav {
    --nav-edge: #27344e;
    --nav-hover: #1b2948;
    background: transparent;
    border: 0;
    box-shadow: none;
    pointer-events: none;
}
.stockmind-nav .nav-inner {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: clamp(14px, 2.5vw, 36px);
    width: min(1080px, calc(100% - 36px));
    max-width: none;
    height: calc(100% - 10px);
    min-height: 0;
    padding-inline: 18px;
    border: 1px solid #6d80ae65;
    border-radius: 999px;
    background: linear-gradient(110deg, #182948f5, #09162cf7 76%);
    box-shadow: 0 8px 25px #050b1d42;
    pointer-events: auto;
}
.stockmind-nav .navbar-panel { display: contents; }
.stockmind-nav .navbar-logo { gap: 8px; padding-right: 14px; border-right: 1px solid #677da555; }
.stockmind-nav .navbar-logo-image { width: 36px; height: 36px; }
.stockmind-nav .navbar-logo-text { font-size: 20px; letter-spacing: -.6px; }
.stockmind-nav .navbar-logo-text strong { color: #b490ff; }
.stockmind-nav .nav-links {
    justify-self: center;
    gap: 3px;
    margin: 0;
    padding: 4px;
    border: 0;
    background: transparent;
    transform: none !important;
}
.stockmind-nav .nav-links a {
    display: grid;
    align-items: center;
    min-height: 34px;
    padding: 0 clamp(8px, 1.12vw, 15px);
    border-radius: 999px;
    color: #d6def0;
    font-size: 13px;
    font-weight: 650;
    text-shadow: none;
}
.stockmind-nav .nav-links a:hover,
.stockmind-nav .nav-links a[aria-current] { color: #fff; background: #263353; text-shadow: none; }
.stockmind-nav .nav-links a[aria-current] { color: #e9d9ff; background: #674e9e66; }
.stockmind-nav .nav-actions { gap: 5px; margin: 0; }
.stockmind-nav #navActions :is(.navbar-cart-link,.navbar-notification-trigger,.favorite-icon a) {
    display: grid;
    width: 36px;
    height: 36px;
    margin: 0;
    padding: 0;
    place-items: center;
    border-radius: 9px;
    color: #e3e9f8;
}
.stockmind-nav #navActions :is(.navbar-cart-link,.navbar-notification-trigger,.favorite-icon a):hover { background: var(--nav-hover); }
.stockmind-nav #navActions .navbar-action-icon { font-size: 18px; }
.stockmind-nav #navActions .favorite-icon .navbar-action-icon { color: #bda3fa; }
.stockmind-nav #navActions .navbar-notifications { flex-basis: 36px; width: 36px; height: 36px; }
.stockmind-nav #guestButtons { gap: 6px; margin-left: 8px; }
.stockmind-nav :is(.navbar-login,.navbar-signup) { display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; font-size: 13px; white-space: nowrap; text-decoration: none; }
.stockmind-nav .navbar-signup { background: #7242d7; }
.stockmind-nav .profile-trigger {
    margin-left: 6px;
    padding: 4px 8px 4px 4px;
    min-height: 38px;
    border: 1px solid var(--nav-edge);
    border-radius: 10px;
    background: #12213c;
    color: #edf1fb;
}
.stockmind-nav .profile-image { width: 28px; height: 28px; }
.stockmind-nav #username { max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stockmind-nav :is(a,button):focus-visible { outline: 2px solid #c4aaff; outline-offset: 2px; }

@media (min-width: 861px) {
    .stockmind-nav .nav-inner { width: min(1160px, calc(100% - 36px)); height: calc(100% - 4px); padding-inline: 22px; }
    .stockmind-nav .navbar-logo-image { width: 38px; height: 38px; }
}

@media (max-width: 860px) {
    .stockmind-nav .nav-inner { grid-template-columns: 1fr auto; width: calc(100% - 28px); padding-inline: 11px; }
    .stockmind-nav .navbar-logo { padding-right: 0; border-right: 0; }
    .stockmind-nav .mobile-menu {
        display: grid;
        place-items: center;
        border: 1px solid var(--nav-edge);
        border-radius: 50%;
        background: #12213c;
    }
    .stockmind-nav .navbar-panel { display: none; }
    .stockmind-nav .nav-inner.mobile-open .navbar-panel {
        position: absolute;
        z-index: 9999;
        inset: calc(100% + 8px) 14px auto auto;
        display: grid;
        width: min(370px, calc(100vw - 28px));
        padding: 10px;
        gap: 8px;
        border: 1px solid var(--nav-edge);
        border-radius: 15px;
        background: #09172e;
        box-shadow: 0 16px 36px #02091670;
    }
    .stockmind-nav .nav-inner.mobile-open .nav-links {
        position: static;
        display: grid;
        width: 100%;
        padding: 4px;
        justify-self: stretch;
        gap: 3px;
    }
    .stockmind-nav .nav-links a { min-height: 40px; width: 100%; }
    .stockmind-nav .nav-inner.mobile-open .nav-actions {
        position: relative;
        inset: auto;
        display: flex;
        justify-content: flex-start;
        flex-wrap: wrap;
        margin: 0;
        padding: 4px 0 0;
        background: transparent;
    }
    .stockmind-nav #navActions .navbar-notifications { position: static; }
    .stockmind-nav .notification-panel { right: 0; width: 100%; }
    .stockmind-nav :is(#guestButtons,.user-profile) { margin-left: auto; }
}

/* Notifications inbox */
.stockmind-nav .notification-panel {
    top: calc(100% + 16px);
    right: -68px;
    width: min(390px, calc(100vw - 28px));
    overflow: hidden;
    border: 1px solid #d9dff0;
    border-radius: 17px;
    background: #f8f9fe;
    color: #172343;
    box-shadow: 0 18px 50px #17234333;
    color-scheme: light;
}
.stockmind-nav .notification-panel__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 17px 12px;
    border: 0;
}
.stockmind-nav .notification-panel__header strong { font-size: 18px; }
.stockmind-nav #notificationSummary { color: #52617e; font-size: 12px; }
.stockmind-nav .notification-panel button {
    cursor: pointer;
    font: inherit;
}
.stockmind-nav .notification-close {
    display: grid;
    place-items: center;
    width: 33px;
    height: 33px;
    border: 1px solid #dce3f2;
    border-radius: 9px;
    background: #edf0fa;
    color: #293a59;
}
.stockmind-nav .notification-close:hover { background: #e5e9f7; }
.stockmind-nav .notification-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 0 16px 12px;
    border-bottom: 1px solid #e0e5f2;
}
.stockmind-nav .notification-filters { display: flex; gap: 3px; padding: 3px; border-radius: 9px; background: #edf0fa; }
.stockmind-nav .notification-filters button,
.stockmind-nav .notification-text-button {
    padding: 7px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #5530a8;
    font-size: 12px;
    font-weight: 750;
}
.stockmind-nav .notification-filters button { color: #515f7b; }
.stockmind-nav .notification-filters button[aria-pressed="true"] { background: #e4d9ff; color: #45248a; }
.stockmind-nav .notification-text-button:hover:not(:disabled) { background: #e5e9f7; }
.stockmind-nav .notification-text-button:disabled { color: #68758e; cursor: default; }
.stockmind-nav .notification-list { max-height: min(375px, 47vh); overflow-y: auto; overscroll-behavior: contain; }
.stockmind-nav .notification-item {
    position: relative;
    display: grid;
    grid-template-columns: 35px minmax(0,1fr);
    gap: 10px;
    padding: 13px 30px 13px 16px;
    border-bottom: 1px solid #e7eaf4;
    background: transparent;
}
.stockmind-nav .notification-item:last-child { border-bottom: 0; }
.stockmind-nav .notification-item.is-unread { background: #efedfc; }
.stockmind-nav a.notification-item:hover { background: #e8e2fb; }
.stockmind-nav .notification-item.is-unread::after {
    position: absolute;
    top: 20px;
    right: 16px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7546d5;
    content: "";
}
.stockmind-nav .notification-item__icon { width: 34px; height: 34px; border-radius: 9px; background: #ebe2ff; color: #5631a4; font-size: 15px; }
.stockmind-nav .notification-item[data-kind="shipping"] .notification-item__icon { background: #e2edff; color: #20528d; }
.stockmind-nav .notification-item[data-kind="delivered"] .notification-item__icon { background: #dff4ea; color: #196444; }
.stockmind-nav .notification-item__copy strong { display: block; color: #172343; font-size: 13px; }
.stockmind-nav .notification-item__copy small,
.stockmind-nav .notification-item__copy time { display: block; margin-top: 3px; color: #435472; font-size: 12px; line-height: 1.45; }
.stockmind-nav .notification-item__copy time { margin-top: 5px; color: #566680; }
.stockmind-nav .notification-empty { padding: 26px 15px; color: #52617e; text-align: center; }
.stockmind-nav .notification-footer { padding: 7px 9px; border-top: 1px solid #e0e5f2; }
.stockmind-nav .notification-footer i { margin-right: 4px; }
.stockmind-nav #navActions .navbar-notification-trigger[aria-expanded="true"] { background: #332750; color: #dfcbff; }
.stockmind-nav #navActions .notification-count { border-color: #101d34; background: #7242d7; }
@media (max-width: 860px) {
    .stockmind-nav .notification-panel { top: calc(100% + 9px); right: 0; width: 100%; }
}
@media (max-height: 490px) {
    .stockmind-nav .notification-list { max-height: 30vh; }
}

</style>
