
<style>
/* =====================================================
   STOCK MIND NAVBAR
===================================================== */

.navbar,
.navbar * {
    box-sizing: border-box;
}

.navbar {
    width: 100%;
    min-height: 64px;
    background: #061735;
    display: flex;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    position: relative;
    z-index: 1000;
}

.nav-inner {
    width: 1180px;
    max-width: 92%;
    min-height: 64px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 38px;
}

/* LOGO */

.navbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
}

.navbar-logo-image {
    width: 38px;
    height: 38px;
    object-fit: contain;
    display: block;
}

.navbar-logo-text {
    color: #ffffff;
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.5px;
}

.navbar-logo-text strong {
    color: #a45cff;
}

/* NAV LINKS */

.nav-links {
    display: flex;
    align-items: center;
    gap: 34px;
    margin-left: 10px;
}

.nav-links a {
    color: #d8deeb;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    transition: color 0.2s ease;
}

.nav-links a:hover {
    color: #a45cff;
}

/* RIGHT ACTIONS */

.nav-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

/* CART */

.navbar-cart-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-decoration: none;
    font-size: 23px;
    width: 30px;
    height: 38px;
}

.cart-count {
    position: absolute;
    top: -2px;
    right: -8px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 20px;
    background: #7c3aed;
    color: white;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* FAVORITES */

.favorite-icon a {
    color: white;
    text-decoration: none;
    font-size: 23px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* GUEST BUTTONS */

#guestButtons {
    display: flex;
    align-items: center;
    gap: 9px;
}

#guestButtons[hidden] {
    display: none !important;
}

.navbar-login,
.navbar-signup {
    height: 34px;
    padding: 0 16px;
    border-radius: 20px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
}

.navbar-login {
    border: 1px solid #71809c;
    background: transparent;
    color: #ffffff;
}

.navbar-login:hover {
    border-color: #a45cff;
}

.navbar-signup {
    padding: 0 17px;
    border: none;
    background: #7135e8;
    color: #ffffff;
    font-weight: 600;
}

.navbar-signup:hover {
    background: #8042f5;
}

/* PROFILE */

.user-profile {
    position: relative;
    display: flex;
    align-items: center;
}

.user-profile[hidden] {
    display: none !important;
}

.profile-trigger {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 66px;
    padding: 2px 10px;
    border: none;
    background: transparent;
    color: white;
    font-family: inherit;
    cursor: pointer;
}

.profile-image {
    width: 48px;
    height: 48px;
    display: block;
    border: 2px solid #8b5cf6;
    border-radius: 50%;
    object-fit: cover;
    background: #ffffff;
}

#username {
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
}

.profile-arrow {
    position: absolute;
    top: 13px;
    right: -1px;
    color: #c4b5fd;
    font-size: 13px;
    transition: transform 0.2s ease;
}

.profile-trigger[aria-expanded="true"] .profile-arrow {
    transform: rotate(180deg);
}

/* DROPDOWN MENU */

.profile-menu {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    width: 245px;
    padding: 8px;
    background: #ffffff;
    color: #17233e;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 14px 35px rgba(0, 0, 0, 0.22);
    z-index: 10000;
}

.profile-menu[hidden] {
    display: none !important;
}

.dropdown-user {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 12px;
    margin-bottom: 6px;
    border-bottom: 1px solid #e5e7eb;
    overflow-wrap: anywhere;
}

.dropdown-user strong {
    color: #061735;
    font-size: 14px;
}

.dropdown-user small {
    color: #718096;
    font-size: 12px;
}

.profile-menu a,
.profile-menu button {
    width: 100%;
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 12px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: #1e293b;
    font-family: inherit;
    font-size: 13px;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
}

.profile-menu a:hover,
.profile-menu button:hover {
    background: #f3e8ff;
    color: #6d28d9;
}

.profile-menu .menu-icon {
    width: 20px;
    text-align: center;
    font-size: 16px;
}

.profile-menu #logoutBtn {
    margin-top: 5px;
    border-top: 1px solid #e5e7eb;
    border-radius: 0 0 9px 9px;
    color: #dc2626;
}

/* MOBILE BUTTON */

.mobile-menu {
    display: none;
    width: 38px;
    height: 38px;
    margin-left: auto;
    border: none;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

/* MOBILE LAYOUT */

@media (max-width: 900px) {
    .nav-inner {
        gap: 20px;
    }

    .nav-links {
        gap: 18px;
        margin-left: 0;
    }

    .nav-actions {
        gap: 10px;
    }
}

@media (max-width: 700px) {
    .navbar,
    .nav-inner {
        min-height: 60px;
    }

    .nav-inner {
        width: calc(100% - 30px);
        gap: 10px;
        flex-wrap: wrap;
    }

    .navbar-logo-text {
        font-size: 18px;
    }

    .navbar-logo-image {
        width: 34px;
        height: 34px;
    }

    .mobile-menu {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .nav-links {
        display: none;
    }

    .nav-inner.mobile-open .nav-links {
        display: flex;
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        padding: 20px;
        margin: 0;
        background: #061735;
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
        z-index: 9999;
    }

    .nav-inner.mobile-open .nav-actions {
        display: flex;
        position: absolute;
        top: 250px;
        left: 0;
        right: 0;
        margin: 0;
        padding: 15px 20px;
        background: #061735;
        justify-content: flex-start;
        flex-wrap: wrap;
        z-index: 9999;
    }

    .profile-menu {
        right: 0;
        width: 230px;
    }

}

/* Profile image and name side by side */
.profile-trigger {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: auto;
    padding: 5px 10px;
    border-radius: 10px;
}

.profile-image {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
}

#username {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    margin: 0;
}

/* Remove any remaining dropdown arrow */
.profile-arrow {
    display: none !important;
}

</style>

        <nav class="nav-links" id="navLinks">

        <div class="nav-actions" id="navActions">

            <a href="/cart/cart.html"
